services:
  - type: web
    name: receiptflow-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: receiptflow-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        fromDatabase:
          name: receiptflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: receiptflow-db
    databaseName: receiptflow
    user: receiptflow
    plan: free
